name: refresh profile graphics

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-graphics

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: портрет из аватарки
        env:
          # логин не захардкожен: берём владельца репозитория
          PROFILE_LOGIN: ${{ github.repository_owner }}
          # если аватарка не портрет, можно подрезать кадр:
          # PORTRAIT_CROP: "x0,y0,x1,y1" в долях, например "0,0.02,0.55,1"
          PORTRAIT_CROP: ""
        run: python scripts/ascii_portrait.py

      - name: статистика
        env:
          # встроенного токена хватает; PROFILE_TOKEN — необязательный запасной
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/generate_stats.py

      - name: коммитим только изменившееся
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.svg'
          if git diff --cached --quiet; then
            echo "картинки не изменились — коммита не будет"
          else
            git commit -m "профиль: обновил графику"
            git push
          fi
